# V-trade configuration. Secrets go in .env, not here.

exchange:
  id: binance            # any ccxt exchange id: binance, kraken, bybit, okx, coinbase, ...
  sandbox: false         # true = use the exchange testnet in live mode (where ccxt supports it)

symbol: BTC/USDT
timeframe: 1h
history_since: "2021-01-01"   # start date for `vtrade fetch`

model:
  horizon: 12            # predict the move over the next N bars
  label_threshold: 0.004 # a bar is labelled "up" if the forward return beats this (covers fees)
  min_train_bars: 4000   # walk-forward: bars before the first out-of-sample prediction
  retrain_every: 500     # walk-forward: retrain the model every N bars
  params:                # HistGradientBoostingClassifier settings
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
    min_samples_leaf: 50
    l2_regularization: 1.0

strategy:
  entry_threshold: 0.58  # enter long when P(up) >= this
  exit_threshold: 0.45   # exit when P(up) <= this
  trend_filter: true     # only enter while price is above its 200-bar EMA
  max_hold_bars: 48      # force an exit after this many bars

risk:
  starting_equity: 10000       # backtest and paper account size (quote currency)
  risk_per_trade: 0.01         # lose at most 1% of equity if the stop is hit
  max_position_pct: 0.5        # never put more than 50% of equity in one position
  stop_atr_mult: 2.0           # stop-loss = entry - 2 x ATR
  take_profit_atr_mult: 3.0    # take-profit = entry + 3 x ATR
  daily_loss_limit: 0.03       # no new entries for the rest of the UTC day after -3%
  max_drawdown: 0.20           # kill switch: stop trading after a 20% drawdown from peak
  min_notional: 10             # skip orders smaller than this (quote currency)

costs:
  fee_rate: 0.001        # 0.1% per fill
  slippage: 0.0005       # 0.05% adverse price per fill

llm:
  enabled: false         # ask Claude to approve or veto each entry (paper/live only)
  model: claude-opus-5
  effort: high           # low | medium | high | xhigh | max
  min_confidence: 0.5    # veto approvals below this confidence
  on_error: veto         # veto | allow: what to do if the API call fails

engine:
  poll_seconds: 30       # how often to check price for stops and for a newly closed bar
  warmup_bars: 900       # candles loaded for feature calculation (max ~1000 per request)
